name: Release

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

env:
  REGISTRY_PREFIX: ghcr.io/crn-software/charging-planning

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  release:
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    outputs:
      published: ${{ steps.semver.outputs.new_release_published }}
      version: ${{ steps.semver.outputs.new_release_version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: semver
        uses: cycjimmy/semantic-release-action@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  image:
    needs: release
    if: needs.release.outputs.published == 'true'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        component: [api, web]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: components/${{ matrix.component }}/Dockerfile
          platforms: linux/arm64,linux/amd64
          push: true
          build-args: APP_VERSION=${{ needs.release.outputs.version }}
          cache-from: type=gha,scope=${{ matrix.component }}
          tags: |
            ${{ env.REGISTRY_PREFIX }}/${{ matrix.component }}:${{ needs.release.outputs.version }}
            ${{ env.REGISTRY_PREFIX }}/${{ matrix.component }}:latest

  deploy:
    needs: [release, image]
    permissions:
      deployments: write
      contents: read
    uses: ./.github/workflows/deploy.yml
    with:
      version: ${{ needs.release.outputs.version }}
