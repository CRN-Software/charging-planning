name: Release

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

env:
  REGISTRY_PREFIX: ghcr.io/crn-software/charging-planning

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  release:
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    outputs:
      published: ${{ steps.semver.outputs.new_release_published }}
      version: ${{ steps.semver.outputs.new_release_version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: semver
        uses: cycjimmy/semantic-release-action@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  image:
    needs: release
    if: needs.release.outputs.published == 'true'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        component: [api, web]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: components/${{ matrix.component }}/Dockerfile
          platforms: linux/arm64,linux/amd64
          push: true
          build-args: APP_VERSION=${{ needs.release.outputs.version }}
          cache-from: type=gha,scope=${{ matrix.component }}
          tags: |
            ${{ env.REGISTRY_PREFIX }}/${{ matrix.component }}:${{ needs.release.outputs.version }}
            ${{ env.REGISTRY_PREFIX }}/${{ matrix.component }}:latest

  deploy:
    needs: [release, image]
    # Self-hosted runner on the Raspberry Pi: only ever reached from main, never from PRs.
    runs-on: [self-hosted, rpi]
    environment:
      name: production
      url: https://charging-planning.crn-tech.fr/api/health
    permissions:
      contents: read
      packages: read
    defaults:
      run:
        working-directory: infrastructure/terraform/server
    env:
      PG_CONN_STR: ${{ secrets.TF_STATE_PG_CONN_STR }}
      TF_IN_AUTOMATION: 'true'
      TF_VAR_image_prefix: ${{ env.REGISTRY_PREFIX }}
      TF_VAR_image_tag: ${{ needs.release.outputs.version }}
      TF_VAR_registry_username: ${{ github.actor }}
      TF_VAR_registry_password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: '1.15.8'
          terraform_wrapper: false
      - run: terraform init -input=false
      - run: terraform apply -input=false -auto-approve
      - name: Smoke test
        run: |
          curl -fsS --retry 10 --retry-delay 3 --retry-all-errors "$(terraform output -raw api_health_url)" \
            | grep -F '"version":"${{ needs.release.outputs.version }}"'
          curl -fsS --retry 10 --retry-delay 3 --retry-all-errors -o /dev/null "$(terraform output -raw web_url)"
