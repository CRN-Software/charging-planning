# Backing services for local development; the apps run on the host (pnpm dev).
name: charging-planning-dev

services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: charging
      POSTGRES_USER: charging
      POSTGRES_PASSWORD: charging
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - postgres:/var/lib/postgresql
    healthcheck:
      test: ['CMD', 'pg_isready', '-U', 'charging', '-d', 'charging']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres:
