# Host nginx on the Raspberry Pi → containers (Terraform vars web_host_port / api_host_port).
# Certificate: sudo certbot --nginx -d charging-planning.crn-tech.fr
server {
    listen 443 ssl;
    http2 on;
    server_name charging-planning.crn-tech.fr;

    ssl_certificate     /etc/letsencrypt/live/charging-planning.crn-tech.fr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/charging-planning.crn-tech.fr/privkey.pem;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location /api/ {
        proxy_pass http://127.0.0.1:18091;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-Id $request_id;
    }

    # Tesla Fleet API partner key, served by the API (public by design).
    location /.well-known/appspecific/ {
        proxy_pass http://127.0.0.1:18091;
    }

    location / {
        proxy_pass http://127.0.0.1:18090;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

server {
    listen 80;
    server_name charging-planning.crn-tech.fr;
    return 301 https://$host$request_uri;
}
